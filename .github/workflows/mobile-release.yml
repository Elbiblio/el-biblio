name: Mobile App Release

on:
  push:
    branches:
      - mobile
    tags:
      - 'mobile-v*'
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g., mobile-v1.2.0)'
        required: false

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.id }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
      tag: ${{ steps.resolve-ref.outputs.tag }}
      version_name: ${{ steps.versioning.outputs.version_name }}
      version_code: ${{ steps.versioning.outputs.version_code }}
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve ref
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build ID
        id: build_id
        run: echo "id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Compute version name/code
        id: versioning
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-ref.outputs.tag }}"
          if [ -n "$TAG" ]; then
            if [[ "$TAG" != mobile-v* ]]; then
              echo "Tag '$TAG' does not match expected prefix 'mobile-v'" >&2
              exit 1
            fi
            VER="${TAG#mobile-v}"
            echo "Using tag version: $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "Computed version_code from semver (MMmmpp): $CODE"
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            if [ -f package.json ]; then
              VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
            else
              VER="0.0.0"
            fi
            echo "Using fallback version_name from package.json (or default): $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            echo "Using GitHub run number for version_code: ${GITHUB_RUN_NUMBER}"
            echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Versioning summary
        run: |
          echo "Ref: ${{ steps.resolve-ref.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.resolve-ref.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: ${{ steps.versioning.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: ${{ steps.versioning.outputs.version_code }}" >> "$GITHUB_STEP_SUMMARY"

  build-android:
    needs:
      - prepare-build
      - build-ios
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --non-interactive --platform android
        env:
          EXPO_NO_DOCTOR: 1

      - name: Apply Android versioning
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const code = process.env.VERSION_CODE;
          const name = process.env.VERSION_NAME;
          if (!code || !/^\d+$/.test(code)) {
            throw new Error(`VERSION_CODE is missing or invalid: "${code ?? ''}"`);
          }
          if (!name) {
            throw new Error('VERSION_NAME is missing');
          }
          let contents = fs.readFileSync(path, 'utf8');
          contents = contents.replace(/versionCode\s+\d+/g, `versionCode ${code}`);
          contents = contents.replace(/versionName\s+"[^"]+"/g, `versionName "${name}"`);
          fs.writeFileSync(path, contents);
          EOF

      - name: Prepare Android keystore from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_KEYSTORE_OBJECT_KEY: ${{ secrets.R2_KEYSTORE_OBJECT_KEY }}
          ANDROID_KEY_DNAME: ${{ secrets.ANDROID_KEY_DNAME }}
        run: |
          set -euo pipefail
          mkdir -p android/key
          KEYSTORE_PATH="android/key/app-release.jks"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          OBJECT_KEY="${R2_KEYSTORE_OBJECT_KEY:-keystore/app-release.jks}"
          S3_URI="s3://${R2_BUCKET}/${OBJECT_KEY}"
          echo "Ensuring signing keystore exists at ${S3_URI}"
          if aws s3 ls "$S3_URI" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "Keystore found in R2, downloading..."
            aws s3 cp "$S3_URI" "$KEYSTORE_PATH" --endpoint-url "$R2_ENDPOINT"
          else
            echo "Keystore not found; generating new keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "${ANDROID_KEY_DNAME:-CN=El-Biblio, OU=Mobile, O=El-Biblio, L=Unknown, ST=Unknown, C=US}"
            echo "Uploading newly generated keystore to R2..."
            aws s3 cp "$KEYSTORE_PATH" "$S3_URI" --endpoint-url "$R2_ENDPOINT"
          fi
          echo "Verifying keystore integrity..."
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Generate PEM certificate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_PEM_OBJECT_KEY: ${{ secrets.R2_PEM_OBJECT_KEY }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/key/app-release.jks"
          PEM_PATH="android/key/app-release.pem"
          DER_PATH="android/key/app-release.der"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PEM_OBJECT_KEY="${R2_PEM_OBJECT_KEY:-keystore/app-release.pem}"
          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$DER_PATH"
          openssl x509 -inform DER -in "$DER_PATH" -out "$PEM_PATH" -outform PEM
          rm -f "$DER_PATH"
          openssl x509 -in "$PEM_PATH" -text -noout > android/key/certificate-info.txt
          echo "Uploading PEM certificate to R2..."
          aws s3 cp "$PEM_PATH" "s3://${R2_BUCKET}/${PEM_OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"

      - name: Create keystore properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat <<EOF > android/keystore.properties
          storeFile=../key/app-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build Android artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -x lint --parallel --no-daemon

      - name: Locate Android outputs
        id: locate-android
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK output produced" >&2
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          if [ -n "$AAB" ]; then
            echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.apk }}
          retention-days: 21

      - name: Upload AAB
        if: steps.locate-android.outputs.aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.aab }}
          retention-days: 21

      - name: Clean keystore material
        if: always()
        run: |
          rm -f android/key/app-release.jks
          rm -f android/key/app-release.pem
          rm -f android/key/app-release.der
          rm -f android/key/certificate-info.txt
          rm -f android/keystore.properties

  build-ios:
    needs: prepare-build
    runs-on: macos-14
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
      APPSTORE_KEY_ID: 66937UCN8F
      APPSTORE_ALT_KEY_ID: 4WKTZ9VTBH
      KEYCHAIN_NAME: build.keychain
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PROVIDER: ${{ secrets.APPSTORE_PROVIDER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ARCHIVE_PATH: ios/build/AppStore.xcarchive
      EXPORT_PATH: ios/build/export
      EXPORT_OPTIONS: ios/exportOptions.plist
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (ios)
        env:
          EXPO_NO_DOCTOR: 1
        run: npx expo prebuild --non-interactive --platform ios

      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install
          else
            echo "Podfile not found, skipping pod install."
          fi

      - name: Detect Xcode target
        id: detect
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1 || true)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1 || true)
          if [ -n "$WORKSPACE" ]; then
            TYPE="workspace"
            TARGET_PATH="$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            TYPE="project"
            TARGET_PATH="$PROJECT"
          else
            echo "No Xcode workspace or project found under ios/" >&2
            exit 1
          fi

          if [ "$TYPE" = "workspace" ]; then
            LIST_ARGS=(-workspace "$TARGET_PATH")
          else
            LIST_ARGS=(-project "$TARGET_PATH")
          fi

          SCHEME_INPUT="${{ secrets.IOS_SCHEME }}"
          if [ -n "$SCHEME_INPUT" ]; then
            SCHEME="$SCHEME_INPUT"
          else
            SCHEME=$(xcodebuild -list -json "${LIST_ARGS[@]}" 2>/dev/null | python3 -c "import json,sys; data=json.load(sys.stdin); container=data.get('workspace') or data.get('project') or {}; schemes=container.get('schemes') or []; pick=next((s for s in schemes if not s.lower().startswith('pods') and not s.endswith('Tests')), schemes[0] if schemes else ''); print(pick, end='')" || true)
          fi

          if [ -z "$SCHEME" ]; then
            echo "Unable to determine build scheme" >&2
            exit 1
          fi

          ARCHIVE_BASENAME=$(echo "$SCHEME" | tr -cd '[:alnum:]_-' )
          if [ -z "$ARCHIVE_BASENAME" ]; then
            ARCHIVE_BASENAME="AppStore"
          fi

          echo "Detected $TYPE at $TARGET_PATH using scheme $SCHEME"
          echo "XCODE_FILE_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "XCODE_FILE_PATH=$TARGET_PATH" >> "$GITHUB_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=ios/build/${ARCHIVE_BASENAME}.xcarchive" >> "$GITHUB_ENV"

      - name: Export development team
        if: env.APPLE_TEAM_ID != ''
        run: echo "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.IOS_XCODE_VERSION != '' && vars.IOS_XCODE_VERSION || '16.2.0' }}

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          if [ "${XCODE_FILE_TYPE}" = "workspace" ]; then
            xcodebuild -resolvePackageDependencies -workspace "${XCODE_FILE_PATH}" -scheme "${XCODE_SCHEME}" -clonedSourcePackagesDirPath .
          else
            xcodebuild -resolvePackageDependencies -project "${XCODE_FILE_PATH}" -scheme "${XCODE_SCHEME}" -clonedSourcePackagesDirPath .
          fi

      - name: Import code signing certificates
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="${KEYCHAIN_NAME:-build.keychain}"
          KEYCHAIN_PATH="$HOME/Library/Keychains/${KEYCHAIN_NAME}"
          security create-keychain -p "" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "" "$KEYCHAIN_NAME"
          if [ -f ios-distribution.p12 ]; then
            echo "Attempting to import ios-distribution.p12"
            PASS_FLAG=()
            if [ -n "${P12_PASSWORD:-}" ]; then
              PASS_FLAG=(-P "$P12_PASSWORD")
            else
              PASS_FLAG=(-P "")
            fi
            if ! security import ios-distribution.p12 -k "$KEYCHAIN_NAME" "${PASS_FLAG[@]}" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A >/dev/null 2>&1; then
              echo "Primary PKCS#12 import failed; attempting to rebuild from certificate and key" >&2
              if [ -f distribution.cer ] && [ -f certs/elbiblio-dist.key ]; then
                TEMP_DIR=$(mktemp -d)
                openssl pkcs12 -export -inkey certs/elbiblio-dist.key -in distribution.cer -name "Apple Distribution" -out "$TEMP_DIR/rebuilt.p12" -passout pass:temp-pass
                security import "$TEMP_DIR/rebuilt.p12" -k "$KEYCHAIN_NAME" -P temp-pass -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A
              else
                echo "Missing distribution.cer or certs/elbiblio-dist.key for fallback" >&2
                exit 1
              fi
            fi
          fi
          if [ -f distribution.cer ]; then
            security import distribution.cer -k "$KEYCHAIN_NAME" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A || true
          fi
          if [ -f ios_development.cer ]; then
            security import ios_development.cer -k "$KEYCHAIN_NAME" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A || true
          fi
          security list-keychains -s "$KEYCHAIN_NAME" $(security list-keychains | tr -d '"')
          security default-keychain -s "$KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
          CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | awk -F '"' '/Apple Distribution/ {print $2; exit}')
          if [ -z "$CODE_SIGN_IDENTITY" ]; then
            CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | awk -F '"' 'NR==1 {print $2}')
          fi
          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/$(uuidgen).mobileprovision"
          cp elbiblioprofile.mobileprovision "$PROFILE_PATH"
          TMP_PLIST=$(mktemp)
          security cms -D -i "$PROFILE_PATH" > "$TMP_PLIST"
          PROFILE_NAME=$( /usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST" 2>/dev/null || echo "" )
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || echo "" )
          TEAM_ID=$( /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$TMP_PLIST" 2>/dev/null || echo "" )
          rm -f "$TMP_PLIST"
          if [ -n "$PROFILE_NAME" ]; then
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          fi
          if [ -n "$PROFILE_UUID" ]; then
            echo "PROVISIONING_PROFILE=$PROFILE_UUID" >> "$GITHUB_ENV"
          fi
          if [ -n "$TEAM_ID" ]; then
            echo "DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Prepare App Store Connect key
        id: appstore-key
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private_keys"
          if [ -f AuthKey_${APPSTORE_KEY_ID}.p8 ]; then
            cp AuthKey_${APPSTORE_KEY_ID}.p8 "${RUNNER_TEMP}/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
            echo "filePath=${RUNNER_TEMP}/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_OUTPUT"
          elif [ -f AuthKey_${APPSTORE_ALT_KEY_ID}.p8 ]; then
            cp AuthKey_${APPSTORE_ALT_KEY_ID}.p8 "${RUNNER_TEMP}/private_keys/AuthKey_${APPSTORE_ALT_KEY_ID}.p8"
            echo "filePath=${RUNNER_TEMP}/private_keys/AuthKey_${APPSTORE_ALT_KEY_ID}.p8" >> "$GITHUB_OUTPUT"
            echo "APPSTORE_KEY_ID=${APPSTORE_ALT_KEY_ID}" >> "$GITHUB_ENV"
          else
            echo "No AuthKey_*.p8 file found in repository" >&2
            exit 1
          fi

      - name: Install App Store Connect key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          cp "${{ steps.appstore-key.outputs.filePath }}" "$HOME/private_keys/"

      - name: Update iOS version numbers
        run: |
          set -euo pipefail
          cd ios
          xcrun agvtool new-marketing-version "${VERSION_NAME}"
          xcrun agvtool new-version -all "${VERSION_CODE}"

      - name: Archive iOS app (workspace)
        if: env.XCODE_FILE_TYPE == 'workspace'
        uses: sersoft-gmbh/xcodebuild-action@v2
        with:
          action: archive
          workspace: ${{ env.XCODE_FILE_PATH }}
          scheme: ${{ env.XCODE_SCHEME }}
          configuration: Release
          sdk: iphoneos
          destination: generic/platform=iOS
          derived-data-path: ios/build/derivedData
          use-xcpretty: false
          build-settings: |
            -archivePath ${{ env.ARCHIVE_PATH }}
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=${{ env.CODE_SIGN_IDENTITY }}
            OTHER_CODE_SIGN_FLAGS=${{ env.OTHER_CODE_SIGN_FLAGS }}
            DEVELOPMENT_TEAM=${{ env.DEVELOPMENT_TEAM }}
            PROVISIONING_PROFILE_SPECIFIER=${{ env.PROVISIONING_PROFILE_SPECIFIER }}

      - name: Archive iOS app (project)
        if: env.XCODE_FILE_TYPE == 'project'
        uses: sersoft-gmbh/xcodebuild-action@v2
        with:
          action: archive
          project: ${{ env.XCODE_FILE_PATH }}
          scheme: ${{ env.XCODE_SCHEME }}
          configuration: Release
          sdk: iphoneos
          destination: generic/platform=iOS
          derived-data-path: ios/build/derivedData
          use-xcpretty: false
          build-settings: |
            -archivePath ${{ env.ARCHIVE_PATH }}

      - name: Write export options
        run: |
          python3 -c "import os; path=os.environ['EXPORT_OPTIONS']; os.makedirs(os.path.dirname(path), exist_ok=True); team=os.environ.get('DEVELOPMENT_TEAM'); lines=['<?xml version=\"1.0\" encoding=\"UTF-8\"?>','<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">','<plist version=\"1.0\">','<dict>','  <key>method</key>','  <string>app-store</string>','  <key>destination</key>','  <string>export</string>','  <key>generateAppStoreInformation</key>','  <false/>','  <key>uploadSymbols</key>','  <true/>','  <key>compileBitcode</key>','  <false/>','  <key>stripSwiftSymbols</key>','  <true/>']; if team: lines.extend([f'  <key>teamID</key>', f'  <string>{team}</string>']); lines.extend(['</dict>','</plist>']); open(path,'w',encoding='utf-8').write('\\n'.join(lines)+'\\n')"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "${EXPORT_PATH}"
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -exportPath "${EXPORT_PATH}" \
            -authenticationKeyIssuerID "${APPSTORE_ISSUER_ID}" \
            -authenticationKeyID "${APPSTORE_KEY_ID}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          ls -R "${EXPORT_PATH}" || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 21

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "${EXPORT_PATH}" -name "*.ipa" -print -quit)
          if [ -z "$IPA" ]; then
            echo "IPA not found in ${EXPORT_PATH}" >&2
            exit 1
          fi
          if [ -n "${APPSTORE_PROVIDER:-}" ]; then
            xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" --asc-provider "$APPSTORE_PROVIDER"
          else
            xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          fi

      - name: Clean up signing material
        if: always()
        run: |
          set +e
          security delete-keychain "${KEYCHAIN_NAME:-build.keychain}" >/dev/null 2>&1
          rm -f "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          rm -f "${EXPORT_OPTIONS}"

  release:
    needs:
      - prepare-build
      - build-android
      - build-ios
    if: needs.prepare-build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-build.outputs.tag }}
          name: Mobile Release ${{ needs.prepare-build.outputs.tag }}
          generate_release_notes: true
          files: dist/**
