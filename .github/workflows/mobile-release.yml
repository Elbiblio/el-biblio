name: Mobile App Release

on:
  push:
    branches:
      - mobile
    tags:
      - 'mobile-v*'
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g., mobile-v1.2.0)'
        required: false

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.id }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
      tag: ${{ steps.resolve-ref.outputs.tag }}
      version_name: ${{ steps.versioning.outputs.version_name }}
      version_code: ${{ steps.versioning.outputs.version_code }}
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve ref
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build ID
        id: build_id
        run: echo "id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Compute version name/code
        id: versioning
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-ref.outputs.tag }}"
          if [ -n "$TAG" ]; then
            if [[ "$TAG" != mobile-v* ]]; then
              echo "Tag '$TAG' does not match expected prefix 'mobile-v'" >&2
              exit 1
            fi
            VER="${TAG#mobile-v}"
            echo "Using tag version: $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "Computed version_code from semver (MMmmpp): $CODE"
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            if [ -f package.json ]; then
              VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
            else
              VER="0.0.0"
            fi
            echo "Using fallback version_name from package.json (or default): $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            echo "Using GitHub run number for version_code: ${GITHUB_RUN_NUMBER}"
            echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Versioning summary
        run: |
          echo "Ref: ${{ steps.resolve-ref.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.resolve-ref.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: ${{ steps.versioning.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: ${{ steps.versioning.outputs.version_code }}" >> "$GITHUB_STEP_SUMMARY"

  build-android:
    needs: prepare-build
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --non-interactive --platform android
        env:
          EXPO_NO_DOCTOR: 1

      - name: Apply Android versioning
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const code = process.env.VERSION_CODE;
          const name = process.env.VERSION_NAME;
          let contents = fs.readFileSync(path, 'utf8');
          contents = contents.replace(/versionCode\s+\d+/g, `versionCode ${code}`);
          contents = contents.replace(/versionName\s+"[^"]+"/g, `versionName "${name}"`);
          fs.writeFileSync(path, contents);
          EOF

      - name: Prepare Android keystore from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_KEYSTORE_OBJECT_KEY: ${{ secrets.R2_KEYSTORE_OBJECT_KEY }}
          ANDROID_KEY_DNAME: ${{ secrets.ANDROID_KEY_DNAME }}
        run: |
          set -euo pipefail
          mkdir -p android/key
          KEYSTORE_PATH="android/key/app-release.jks"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          OBJECT_KEY="${R2_KEYSTORE_OBJECT_KEY:-keystore/app-release.jks}"
          S3_URI="s3://${R2_BUCKET}/${OBJECT_KEY}"
          echo "Ensuring signing keystore exists at ${S3_URI}"
          if aws s3 ls "$S3_URI" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "Keystore found in R2, downloading..."
            aws s3 cp "$S3_URI" "$KEYSTORE_PATH" --endpoint-url "$R2_ENDPOINT"
          else
            echo "Keystore not found; generating new keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "${ANDROID_KEY_DNAME:-CN=El-Biblio, OU=Mobile, O=El-Biblio, L=Unknown, ST=Unknown, C=US}"
            echo "Uploading newly generated keystore to R2..."
            aws s3 cp "$KEYSTORE_PATH" "$S3_URI" --endpoint-url "$R2_ENDPOINT"
          fi
          echo "Verifying keystore integrity..."
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Generate PEM certificate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_PEM_OBJECT_KEY: ${{ secrets.R2_PEM_OBJECT_KEY }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/key/app-release.jks"
          PEM_PATH="android/key/app-release.pem"
          DER_PATH="android/key/app-release.der"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PEM_OBJECT_KEY="${R2_PEM_OBJECT_KEY:-keystore/app-release.pem}"
          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$DER_PATH"
          openssl x509 -inform DER -in "$DER_PATH" -out "$PEM_PATH" -outform PEM
          rm -f "$DER_PATH"
          openssl x509 -in "$PEM_PATH" -text -noout > android/key/certificate-info.txt
          echo "Uploading PEM certificate to R2..."
          aws s3 cp "$PEM_PATH" "s3://${R2_BUCKET}/${PEM_OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"

      - name: Create keystore properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat <<EOF > android/keystore.properties
          storeFile=../key/app-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build Android artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -x lint --parallel --no-daemon

      - name: Locate Android outputs
        id: locate-android
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK output produced" >&2
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          if [ -n "$AAB" ]; then
            echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.apk }}
          retention-days: 21

      - name: Upload AAB
        if: steps.locate-android.outputs.aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.aab }}
          retention-days: 21

      - name: Clean keystore material
        if: always()
        run: |
          rm -f android/key/app-release.jks
          rm -f android/key/app-release.pem
          rm -f android/key/app-release.der
          rm -f android/key/certificate-info.txt
          rm -f android/keystore.properties

  build-ios:
    needs: prepare-build
    runs-on: macos-latest
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (ios)
        run: npx expo prebuild --non-interactive --platform ios
        env:
          EXPO_NO_DOCTOR: 1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Apply iOS versioning
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -1d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          PROJECT=$(ls -1d ios/*.xcodeproj 2>/dev/null | head -n 1 || true)
          SCHEME=""
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.workspace&&j.workspace.schemes)||[];if(arr.length){console.log(arr[0])}}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            SETTINGS=$(xcodebuild -showBuildSettings -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release 2>/dev/null)
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.project&&j.project.schemes)||[];if(arr.length){console.log(arr[0])}}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            SETTINGS=$(xcodebuild -showBuildSettings -project "$PROJECT" -scheme "$SCHEME" -configuration Release 2>/dev/null)
          else
            SETTINGS=""
          fi
          SRCROOT=$(echo "$SETTINGS" | awk -F" = " '/\bSRCROOT\b/ {print $2; exit}')
          INFOPLIST_FILE=$(echo "$SETTINGS" | awk -F" = " '/\bINFOPLIST_FILE\b/ {print $2; exit}')
          if [ -n "${INFOPLIST_FILE:-}" ]; then
            if [[ "$INFOPLIST_FILE" = /* ]]; then
              PLIST="$INFOPLIST_FILE"
            else
              INFOPATH="$INFOPLIST_FILE"
              INFOPATH="${INFOPATH//\$\(SRCROOT\)/$SRCROOT}"
              INFOPATH="${INFOPATH//\${SRCROOT}/$SRCROOT}"
              INFOPATH="${INFOPATH//\$\(PROJECT_DIR\)/$SRCROOT}"
              INFOPATH="${INFOPATH//\${PROJECT_DIR}/$SRCROOT}"
              if [[ "$INFOPATH" != /* ]]; then
                BASE_DIR="${SRCROOT:-ios}"
                PLIST="$BASE_DIR/$INFOPATH"
              else
                PLIST="$INFOPATH"
              fi
            fi
          fi
          if [ -z "${PLIST:-}" ] || [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -type f -name Info.plist \( -not -path "*/Pods/*" -and -not -path "*Tests/*" \) | head -n 1 || true)
          fi
          if [ -z "${PLIST:-}" ] || [ ! -f "$PLIST" ]; then
            echo "Unable to locate Info.plist" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION_CODE" "$PLIST"

      - name: Build iOS (simulator)
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -1d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          PROJECT=$(ls -1d ios/*.xcodeproj 2>/dev/null | head -n 1 || true)
          if [ -n "$WORKSPACE" ]; then
            echo "Using workspace: $WORKSPACE"
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.workspace&&j.workspace.schemes)||[];const pick=arr.find(n=>!/^Pods(\\b|\\-)/.test(n)&&!/Tests$/.test(n))||arr[0]||'';process.stdout.write(pick)}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            if [ -z "$SCHEME" ]; then
              echo "Failed to detect scheme from workspace" >&2
              exit 1
            fi
            echo "Building scheme: $SCHEME"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          elif [ -n "$PROJECT" ]; then
            echo "Using project: $PROJECT"
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.project&&j.project.schemes)||[];const pick=arr.find(n=>!/^Pods(\\b|\\-)/.test(n)&&!/Tests$/.test(n))||arr[0]||'';process.stdout.write(pick)}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            if [ -z "$SCHEME" ]; then
              echo "Failed to detect scheme from project" >&2
              exit 1
            fi
            echo "Building scheme: $SCHEME"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "No Xcode workspace or project found under ios/" >&2
            ls -1d ios/*.xcworkspace ios/*.xcodeproj 2>/dev/null || true
            exit 1
          fi
          echo "Build completed. Checking outputs..."
          find ios/build -type d -name "*.app" 2>/dev/null || echo "No .app bundles found in ios/build"
          ls -la ios/build/Build/Products/ 2>/dev/null || echo "Products directory not found"

      - name: Package iOS build
        id: package-ios
        run: |
          APP=$(find ios/build -type d -name "*.app" -print -quit 2>/dev/null || true)
          if [ -z "$APP" ]; then
            echo "No .app bundle produced" >&2
            echo "Searching entire ios/build directory structure:"
            find ios/build -type d 2>/dev/null | head -20 || true
            echo "Searching for any .app bundles:"
            find ios -type d -name "*.app" 2>/dev/null || echo "No .app found anywhere in ios/"
            exit 1
          fi
          echo "Found .app at: $APP"
          OUTDIR=$(dirname "$APP")
          BASENAME=$(basename "$APP")
          cd "$OUTDIR"
          mkdir -p Payload
          cp -R "$BASENAME" Payload/
          zip -qry ElBiblio-simulator.ipa Payload
          echo "ipa_path=$OUTDIR/ElBiblio-simulator.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.package-ios.outputs.ipa_path }}
          retention-days: 21

  release:
    needs:
      - prepare-build
      - build-android
      - build-ios
    if: needs.prepare-build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-build.outputs.tag }}
          name: Mobile Release ${{ needs.prepare-build.outputs.tag }}
          generate_release_notes: true
          files: dist/**
