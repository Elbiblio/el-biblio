name: Mobile App Release

on:
  push:
    branches:
      - mobile
    tags:
      - 'mobile-v*'
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g., mobile-v1.2.0)'
        required: false

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.id }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
      tag: ${{ steps.resolve-ref.outputs.tag }}
      version_name: ${{ steps.versioning.outputs.version_name }}
      version_code: ${{ steps.versioning.outputs.version_code }}
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve ref
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate build ID
        id: build_id
        run: echo "id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Compute version name/code
        id: versioning
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-ref.outputs.tag }}"
          if [ -n "$TAG" ]; then
            if [[ "$TAG" != mobile-v* ]]; then
              echo "Tag '$TAG' does not match expected prefix 'mobile-v'" >&2
              exit 1
            fi
            VER="${TAG#mobile-v}"
            echo "Using tag version: $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "Computed version_code from semver (MMmmpp): $CODE"
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            if [ -f package.json ]; then
              VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
            else
              VER="0.0.0"
            fi
            echo "Using fallback version_name from package.json (or default): $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            echo "Using GitHub run number for version_code: ${GITHUB_RUN_NUMBER}"
            echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Versioning summary
        run: |
          echo "Ref: ${{ steps.resolve-ref.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.resolve-ref.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: ${{ steps.versioning.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: ${{ steps.versioning.outputs.version_code }}" >> "$GITHUB_STEP_SUMMARY"
  build-android:
    needs:
      - prepare-build
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --non-interactive --platform android
        env:
          EXPO_NO_DOCTOR: 1

      - name: Apply Android versioning
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const code = process.env.VERSION_CODE;
          const name = process.env.VERSION_NAME;
          if (!code || !/^\d+$/.test(code)) {
            throw new Error(`VERSION_CODE is missing or invalid: "${code ?? ''}"`);
          }
          if (!name) {
            throw new Error('VERSION_NAME is missing');
          }
          let contents = fs.readFileSync(path, 'utf8');
          contents = contents.replace(/versionCode\s+\d+/g, `versionCode ${code}`);
          contents = contents.replace(/versionName\s+"[^"]+"/g, `versionName "${name}"`);
          fs.writeFileSync(path, contents);
          EOF
      - name: Prepare Android keystore from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_KEYSTORE_OBJECT_KEY: ${{ secrets.R2_KEYSTORE_OBJECT_KEY }}
          ANDROID_KEY_DNAME: ${{ secrets.ANDROID_KEY_DNAME }}
        run: |
          set -euo pipefail
          mkdir -p android/key
          KEYSTORE_PATH="android/key/app-release.jks"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          OBJECT_KEY="${R2_KEYSTORE_OBJECT_KEY:-keystore/app-release.jks}"
          S3_URI="s3://${R2_BUCKET}/${OBJECT_KEY}"
          echo "Ensuring signing keystore exists at ${S3_URI}"
          if aws s3 ls "$S3_URI" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "Keystore found in R2, downloading..."
            aws s3 cp "$S3_URI" "$KEYSTORE_PATH" --endpoint-url "$R2_ENDPOINT"
          else
            echo "Keystore not found; generating new keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "${ANDROID_KEY_DNAME:-CN=El-Biblio, OU=Mobile, O=El-Biblio, L=Unknown, ST=Unknown, C=US}"
            echo "Uploading newly generated keystore to R2..."
            aws s3 cp "$KEYSTORE_PATH" "$S3_URI" --endpoint-url "$R2_ENDPOINT"
          fi
          echo "Verifying keystore integrity..."
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
      - name: Generate PEM certificate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_PEM_OBJECT_KEY: ${{ secrets.R2_PEM_OBJECT_KEY }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/key/app-release.jks"
          PEM_PATH="android/key/app-release.pem"
          DER_PATH="android/key/app-release.der"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PEM_OBJECT_KEY="${R2_PEM_OBJECT_KEY:-keystore/app-release.pem}"
          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$DER_PATH"
          openssl x509 -inform DER -in "$DER_PATH" -out "$PEM_PATH" -outform PEM
          rm -f "$DER_PATH"
          openssl x509 -in "$PEM_PATH" -text -noout > android/key/certificate-info.txt
          echo "Uploading PEM certificate to R2..."
          aws s3 cp "$PEM_PATH" "s3://${R2_BUCKET}/${PEM_OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"
      - name: Create keystore properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat <<EOF > android/keystore.properties
          storeFile=../key/app-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Verify Android signing config
        working-directory: android
        run: |
          set -euo pipefail
          echo "Generating Gradle signing report..."
          chmod +x ./gradlew
          ./gradlew :app:signingReport --no-daemon
          REPORT=$(./gradlew :app:signingReport --console=plain --no-daemon | sed -n '/Variant: release/,/Variant:/p')
          echo "$REPORT"
          # Fail if debug alias or debug keystore is detected for release variant
          if echo "$REPORT" | grep -qi 'androiddebugkey'; then
            echo "::error::Release signing appears to use the debug alias (androiddebugkey)." >&2
            exit 1
          fi
          if echo "$REPORT" | grep -qi 'debug.keystore'; then
            echo "::error::Release signing appears to use the debug keystore." >&2
            exit 1
          fi
          if ! echo "$REPORT" | grep -qi "Alias name: ${ANDROID_KEY_ALIAS}"; then
            echo "::warning::Release signing report did not show expected alias ${ANDROID_KEY_ALIAS}. Proceeding, but verify Play Console if issues persist." >&2
          fi
      - name: Build Android artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -x lint --parallel --no-daemon
      - name: Locate Android outputs
        id: locate-android
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK output produced" >&2
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          if [ -n "$AAB" ]; then
            echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.apk }}
          retention-days: 21

      - name: Upload AAB
        if: steps.locate-android.outputs.aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.locate-android.outputs.aab }}
          retention-days: 21

      - name: Clean keystore material
        if: always()
        run: |
          rm -f android/key/app-release.jks
          rm -f android/key/app-release.pem
          rm -f android/key/app-release.der
          rm -f android/key/certificate-info.txt
          rm -f android/keystore.properties
  build-ios:
    needs: prepare-build
    runs-on: macos-latest
    env:
      VERSION_NAME: ${{ needs.prepare-build.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare-build.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (ios)
        run: npx expo prebuild --non-interactive --platform ios
        env:
          EXPO_NO_DOCTOR: 1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Apply iOS versioning
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -1d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          PROJECT=$(ls -1d ios/*.xcodeproj 2>/dev/null | head -n 1 || true)
          SCHEME=""
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.workspace&&j.workspace.schemes)||[];if(arr.length){console.log(arr[0])}}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            SETTINGS=$(xcodebuild -showBuildSettings -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release 2>/dev/null)
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.project&&j.project.schemes)||[];if(arr.length){console.log(arr[0])}}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
            SETTINGS=$(xcodebuild -showBuildSettings -project "$PROJECT" -scheme "$SCHEME" -configuration Release 2>/dev/null)
          else
            SETTINGS=""
          fi
          SRCROOT=$(echo "$SETTINGS" | awk -F" = " '/\bSRCROOT\b/ {print $2; exit}')
          INFOPLIST_FILE=$(echo "$SETTINGS" | awk -F" = " '/\bINFOPLIST_FILE\b/ {print $2; exit}')
          if [ -n "${INFOPLIST_FILE:-}" ]; then
            if [[ "$INFOPLIST_FILE" = /* ]]; then
              PLIST="$INFOPLIST_FILE"
            else
              INFOPATH="$INFOPLIST_FILE"
              INFOPATH="${INFOPATH//\$\(SRCROOT\)/$SRCROOT}"
              INFOPATH="${INFOPATH//\${SRCROOT}/$SRCROOT}"
              INFOPATH="${INFOPATH//\$\(PROJECT_DIR\)/$SRCROOT}"
              INFOPATH="${INFOPATH//\${PROJECT_DIR}/$SRCROOT}"
              if [[ "$INFOPATH" != /* ]]; then
                BASE_DIR="${SRCROOT:-ios}"
                PLIST="$BASE_DIR/$INFOPATH"
              else
                PLIST="$INFOPATH"
              fi
            fi
          fi
          if [ -z "${PLIST:-}" ] || [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -type f -name Info.plist \( -not -path "*/Pods/*" -and -not -path "*Tests/*" \) | head -n 1 || true)
          fi
          if [ -z "${PLIST:-}" ] || [ ! -f "$PLIST" ]; then
            echo "Unable to locate Info.plist" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION_CODE" "$PLIST"
      - name: Fetch and install signing certificate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_IOS_CERT_OBJECT_KEY: ${{ secrets.R2_IOS_CERT_OBJECT_KEY }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          IOS_KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-}"
          if [ -z "$IOS_KEYCHAIN_PASSWORD" ]; then
            IOS_KEYCHAIN_PASSWORD=$(python3 -c "import secrets; print(secrets.token_hex(16))")
            echo "Using generated temporary keychain password"
            echo "IOS_KEYCHAIN_PASSWORD=$IOS_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using IOS_KEYCHAIN_PASSWORD from secrets"
            echo "IOS_KEYCHAIN_PASSWORD=$IOS_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          fi
          CERT_DIR="ios/signing"
          mkdir -p "$CERT_DIR"
          KEYCHAIN="build.keychain-db"
          CERT_PATH="$CERT_DIR/ios-distribution.p12"
          LOCAL_P12="ios-distribution.p12"
          LOCAL_CERT="distribution.cer"
          LOCAL_KEY="certs/elbiblio-dist.key"
          CAN_GENERATE=0
          if [ -f "$LOCAL_CERT" ] && [ -f "$LOCAL_KEY" ]; then
            CAN_GENERATE=1
          fi
          # Generate .p12 with a simple known password that macOS security can handle
          P12_PASS="temp"
          if [ "$CAN_GENERATE" -eq 1 ]; then
            echo "Preparing certificate PEM from $LOCAL_CERT"
            CERT_PEM="distribution.pem"
            if openssl x509 -in "$LOCAL_CERT" -inform DER -noout >/dev/null 2>&1; then
              openssl x509 -in "$LOCAL_CERT" -inform DER -out "$CERT_PEM"
            elif openssl x509 -in "$LOCAL_CERT" -inform PEM -noout >/dev/null 2>&1; then
              cp "$LOCAL_CERT" "$CERT_PEM"
            else
              echo "Unable to parse $LOCAL_CERT as DER or PEM certificate" >&2
              exit 1
            fi
            echo "Verifying private key matches certificate (pubkey hash)"
            openssl pkey -in "$LOCAL_KEY" -pubout -out key_pub.pem >/dev/null 2>&1 || { echo "Unable to read private key $LOCAL_KEY" >&2; exit 1; }
            openssl x509 -in "$CERT_PEM" -pubkey -noout > cert_pub.pem 2>/dev/null || { echo "Unable to read certificate $CERT_PEM" >&2; exit 1; }
            KEY_HASH=$(openssl pkey -pubin -in key_pub.pem -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')
            CERT_HASH=$(openssl pkey -pubin -in cert_pub.pem -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')
            if [ -z "$KEY_HASH" ] || [ -z "$CERT_HASH" ] || [ "$KEY_HASH" != "$CERT_HASH" ]; then
              echo "Private key and certificate do not match" >&2
              exit 1
            fi
            echo "Generating $LOCAL_P12 with temporary password"
            if ! openssl pkcs12 -export -inkey "$LOCAL_KEY" -in "$CERT_PEM" -out "$LOCAL_P12" -name "Apple Distribution" -passout pass:"$P12_PASS"; then
              echo "Failed to generate PKCS#12. Ensure distribution.cer is valid and matches the private key." >&2
              exit 1
            fi
          else
            if [ -f "$LOCAL_P12" ]; then
              echo "Found existing $LOCAL_P12; will use provided IOS_CERT_PASSWORD or default"
              P12_PASS="${IOS_CERT_PASSWORD:-temp}"
            else
              echo "Expected ios-distribution.p12 or distribution.cer + certs/elbiblio-dist.key in repository root" >&2
              exit 1
            fi
          fi
          if [ ! -f "$LOCAL_P12" ]; then
            echo "Failed to prepare $LOCAL_P12" >&2
            exit 1
          fi
          USE_R2=1
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            USE_R2=0
          fi
          if [ "$USE_R2" -eq 1 ]; then
            R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            OBJECT_KEY="${R2_IOS_CERT_OBJECT_KEY:-signing/ios-distribution.p12}"
            echo "Uploading local $LOCAL_P12 to s3://${R2_BUCKET}/${OBJECT_KEY}"
            aws s3 cp "$LOCAL_P12" "s3://${R2_BUCKET}/${OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"
            cp "$LOCAL_P12" "$CERT_PATH"
          else
            echo "R2 credentials not provided; using local $LOCAL_P12"
            cp "$LOCAL_P12" "$CERT_PATH"
          fi
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "Importing certificate with password: $P12_PASS"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | sed 's/\"//g')
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1 || true
          echo "Verifying code signing identities in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Apple Distribution/ {print $2; exit}')
          if [ -z "$CERT_IDENTITY" ]; then
            CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' 'NR==1 {print $2}')
          fi
          CERT_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Distribution/ {print $2; exit}')
          if [ -z "$CERT_HASH" ]; then
            CERT_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')
          fi
          if [ -n "$CERT_IDENTITY" ]; then
            echo "Detected code signing identity: $CERT_IDENTITY"
            echo "CODE_SIGN_IDENTITY=$CERT_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERT_HASH" ]; then
            echo "Using identity hash for build: $CERT_HASH"
            echo "CODE_SIGN_IDENTITY_FOR_BUILD=$CERT_HASH" >> "$GITHUB_ENV"
          fi
          KEYCHAIN_FULL_PATH="$HOME/Library/Keychains/$KEYCHAIN"
          echo "Using keychain: $KEYCHAIN_FULL_PATH"
          echo "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_FULL_PATH" >> "$GITHUB_ENV"
      - name: Fetch provisioning profile from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_IOS_PROFILE_OBJECT_KEY: ${{ secrets.R2_IOS_PROFILE_OBJECT_KEY }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/store-profile.mobileprovision"
          LOCAL_PROFILE="Elbiblio.mobileprovision"
          USE_R2=1
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            USE_R2=0
          fi
          if [ "$USE_R2" -eq 1 ]; then
            R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            OBJECT_KEY="${R2_IOS_PROFILE_OBJECT_KEY:-signing/ios-store.mobileprovision}"
            if ! aws s3 ls "s3://${R2_BUCKET}/${OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              if [ -f "$LOCAL_PROFILE" ]; then
                echo "Provisioning profile missing in R2; uploading local $LOCAL_PROFILE"
                aws s3 cp "$LOCAL_PROFILE" "s3://${R2_BUCKET}/${OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"
              else
                echo "Expected $LOCAL_PROFILE in repository root or configure R2 credentials." >&2
                exit 1
              fi
            fi
            aws s3 cp "s3://${R2_BUCKET}/${OBJECT_KEY}" "$PROFILE_PATH" --endpoint-url "$R2_ENDPOINT"
          else
            if [ ! -f "$LOCAL_PROFILE" ]; then
              echo "R2 credentials not provided and $LOCAL_PROFILE not found in repository." >&2
              exit 1
            fi
            echo "R2 credentials not provided; using local $LOCAL_PROFILE"
            cp "$LOCAL_PROFILE" "$PROFILE_PATH"
          fi
          if [ ! -f "$PROFILE_PATH" ]; then
            echo "Provisioning profile not found at $PROFILE_PATH" >&2
            exit 1
          fi
          TMP_PLIST=$(mktemp)
          if ! security cms -D -i "$PROFILE_PATH" > "$TMP_PLIST"; then
            echo "Failed to decode provisioning profile" >&2
            rm -f "$TMP_PLIST"
            exit 1
          fi
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true )
          PROFILE_NAME=$( /usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST" 2>/dev/null || true )
          TEAM_ID=$( /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$TMP_PLIST" 2>/dev/null || true )
          APS_ENV=$( /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$TMP_PLIST" 2>/dev/null || true )
          rm -f "$TMP_PLIST"
          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "Unable to extract UUID/Name from provisioning profile" >&2
            exit 1
          fi
          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE=$PROFILE_UUID" >> "$GITHUB_ENV"
          if [ -n "$TEAM_ID" ]; then
            echo "Detected Apple Team ID: $TEAM_ID"
            echo "DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$APS_ENV" ]; then
            echo "Provisioning profile includes Push Notifications (aps-environment=$APS_ENV)"
            echo "PROFILE_HAS_PUSH=1" >> "$GITHUB_ENV"
            echo "APS_ENVIRONMENT=$APS_ENV" >> "$GITHUB_ENV"
          else
            echo "Provisioning profile does not include Push Notifications entitlement" >&2
            echo "PROFILE_HAS_PUSH=0" >> "$GITHUB_ENV"
            echo "Please regenerate the provisioning profile with Push Notifications enabled and upload it to R2 (or place Elbiblio.mobileprovision in the repo root)." >&2
            exit 1
          fi
      - name: Fetch App Store Connect API key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_KEYSTORE_BUCKET }}
          R2_APPSTORE_API_KEY_OBJECT_KEY: ${{ secrets.R2_APPSTORE_API_KEY_OBJECT_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ios/signing
          USE_R2=1
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            USE_R2=0
          fi
          KEY_FILE=""
          if [ -n "${APPSTORE_KEY_ID:-}" ] && [ -f "AuthKey_${APPSTORE_KEY_ID}.p8" ]; then
            KEY_FILE="AuthKey_${APPSTORE_KEY_ID}.p8"
          else
            KEY_FILE=$(ls AuthKey_*.p8 2>/dev/null | head -n 1 || true)
          fi
          if [ "$USE_R2" -eq 1 ]; then
            R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            OBJECT_KEY="${R2_APPSTORE_API_KEY_OBJECT_KEY:-signing/appstoreconnect/AuthKey.p8}"
            if ! aws s3 ls "s3://${R2_BUCKET}/${OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              if [ -n "$KEY_FILE" ]; then
                echo "App Store Connect API key missing in R2; uploading $KEY_FILE"
                aws s3 cp "$KEY_FILE" "s3://${R2_BUCKET}/${OBJECT_KEY}" --endpoint-url "$R2_ENDPOINT"
              else
                echo "Expected AuthKey_<KEYID>.p8 in repository root or configure R2 credentials." >&2
                exit 1
              fi
            fi
            aws s3 cp "s3://${R2_BUCKET}/${OBJECT_KEY}" "ios/signing/AuthKey_AppStoreConnect.p8" --endpoint-url "$R2_ENDPOINT"
          else
            if [ -z "$KEY_FILE" ]; then
              echo "R2 credentials not provided and no AuthKey_<KEYID>.p8 found in repository." >&2
              exit 1
            fi
            echo "R2 credentials not provided; using local $KEY_FILE"
            cp "$KEY_FILE" "ios/signing/AuthKey_AppStoreConnect.p8"
          fi
      - name: Install App Store Connect key for altool
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_KEY_ID:-}" ]; then
            echo "APPSTORE_KEY_ID secret is not set" >&2
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          cp ios/signing/AuthKey_AppStoreConnect.p8 "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Determine workspace/project and scheme
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -1d ios/*.xcworkspace 2>/dev/null | head -n 1 || true)
          PROJECT=$(ls -1d ios/*.xcodeproj 2>/dev/null | head -n 1 || true)
          if [ -n "$WORKSPACE" ]; then
            echo "WORKSPACE_PATH=$WORKSPACE" >> "$GITHUB_ENV"
            echo "PROJECT_PATH=" >> "$GITHUB_ENV"
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.workspace&&j.workspace.schemes)||[];const pick=arr.find(n=>/^(ElBiblio|El-Biblio|Elbiblio)/.test(n))||arr.find(n=>!/^Pods(\\b|\\-)/.test(n)&&!/Tests$/.test(n))||arr[0]||'';process.stdout.write(pick)}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
          elif [ -n "$PROJECT" ]; then
            echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"
            echo "WORKSPACE_PATH=" >> "$GITHUB_ENV"
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const arr=(j.project&&j.project.schemes)||[];const pick=arr.find(n=>/^(ElBiblio|El-Biblio|Elbiblio)/.test(n))||arr.find(n=>!/^[Pp]ods(\\b|\\-)/.test(n)&&!/Tests$/.test(n))||arr[0]||'';process.stdout.write(pick)}catch(e){} })" || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/ {getline; print $1; exit}')
            fi
          else
            echo "No Xcode workspace or project found under ios/" >&2
            exit 1
          fi
          if [ -z "$SCHEME" ]; then
            echo "Unable to determine scheme" >&2
            exit 1
          fi
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
      - name: Resolve Swift Package dependencies
        run: |
          set -euo pipefail
          if [ -n "${WORKSPACE_PATH:-}" ]; then
            xcodebuild -resolvePackageDependencies -workspace "${WORKSPACE_PATH}" -scheme "${SCHEME}" -clonedSourcePackagesDirPath .
          elif [ -n "${PROJECT_PATH:-}" ]; then
            xcodebuild -resolvePackageDependencies -project "${PROJECT_PATH}" -scheme "${SCHEME}" -clonedSourcePackagesDirPath .
          fi
      - name: Archive iOS app
        run: |
          set -euo pipefail
          ARCHIVE_PATH="ElBiblio.xcarchive"
          RESULT_BUNDLE="ios/build/ElBiblio.xcresult"
          LOG_PATH="ios/build/xcodebuild-archive.log"
          rm -rf "$ARCHIVE_PATH" "$RESULT_BUNDLE"
          rm -f "$LOG_PATH"
          
          if [ -n "${WORKSPACE_PATH:-}" ]; then
            BUILD_TARGET="-workspace ${WORKSPACE_PATH}"
          elif [ -n "${PROJECT_PATH:-}" ]; then
            BUILD_TARGET="-project ${PROJECT_PATH}"
          else
            echo "No workspace or project found" >&2
            exit 1
          fi
          
          if ! xcodebuild archive \
            $BUILD_TARGET \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath ios/build/derivedData \
            -resultBundlePath "$RESULT_BUNDLE" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}" \
            CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY_FOR_BUILD}" \
            OTHER_CODE_SIGN_FLAGS="${OTHER_CODE_SIGN_FLAGS}" \
            | tee "$LOG_PATH"; then
            echo "::error::xcodebuild archive failed" >&2
            if [ -f "$LOG_PATH" ]; then
              echo "----- xcodebuild archive tail -----" >&2
              tail -n 200 "$LOG_PATH" >&2 || true
              echo "----- end of tail -----" >&2
            fi
            exit 1
          fi
          
          echo "Archive created at: $ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH" || true
      - name: Upload archive xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-xcresult-${{ github.run_id }}
          path: ios/build/ElBiblio.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log-${{ github.run_id }}
          path: ios/build/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate archive and export path
        run: |
          set -euo pipefail
          # Check expected location first
          if [ -d "ElBiblio.xcarchive" ]; then
            echo "ARCHIVE_PATH=ElBiblio.xcarchive" >> "$GITHUB_ENV"
            exit 0
          fi
          # Search for any .xcarchive
          echo "Searching for archives..." >&2
          FOUND=$(find . -maxdepth 2 -type d -name "*.xcarchive" 2>/dev/null | head -n 1 || true)
          if [ -n "$FOUND" ] && [ -d "$FOUND" ]; then
            echo "Using discovered archive: $FOUND"
            echo "ARCHIVE_PATH=$FOUND" >> "$GITHUB_ENV"
          else
            echo "No .xcarchive found" >&2
            ls -la . || true
            exit 1
          fi
      - name: Prepare export options
        run: |
          cat <<'EOF' > ios/exportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
            </plist>
          EOF
      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath ios/build/export \
            -allowProvisioningUpdates
          ls -R ios/build/export || true
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ needs.prepare-build.outputs.build_id }}
          path: ios/build/export/*.ipa
          retention-days: 21

      - name: Upload IPA to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PROVIDER: ${{ secrets.APPSTORE_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_ISSUER_ID:-}" ]; then
            echo "APPSTORE_ISSUER_ID secret is not set" >&2
            exit 1
          fi
          if [ -z "${APPSTORE_KEY_ID:-}" ]; then
            echo "APPSTORE_KEY_ID secret is not set" >&2
            exit 1
          fi
          IPA_PATH=$(ls ios/build/export/*.ipa | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in export directory" >&2
            exit 1
          fi
          if [ -n "${APPSTORE_PROVIDER:-}" ]; then
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" --asc-provider "$APPSTORE_PROVIDER"
          else
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          fi
          echo "Upload to TestFlight triggered via altool"
      - name: Clean up signing material
        if: always()
        run: |
          set +e
          security delete-keychain build.keychain-db
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/store-profile.mobileprovision"
          rm -f ios/signing/AuthKey_AppStoreConnect.p8
          if [ -n "${APPSTORE_KEY_ID:-}" ]; then
            rm -f "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          fi
  release:
    needs:
      - prepare-build
      - build-android
      - build-ios
    if: needs.prepare-build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-build.outputs.tag }}
          name: Mobile Release ${{ needs.prepare-build.outputs.tag }}
          generate_release_notes: true
          files: dist/**
