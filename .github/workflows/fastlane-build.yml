name: Expo Local Mobile Build

on:
  push:
    branches:
      - mobile
    tags:
      - 'mobile-v*'
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g., mobile-v1.2.0)'
        required: false

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.id }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
      tag: ${{ steps.resolve-ref.outputs.tag }}
      version_name: ${{ steps.versioning.outputs.version_name }}
      version_code: ${{ steps.versioning.outputs.version_code }}
    steps:
      - name: Resolve ref
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build ID
        id: build_id
        run: echo "id=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Compute version name/code
        id: versioning
        run: |
          TAG="${{ steps.resolve-ref.outputs.tag }}"
          if [ -n "$TAG" ]; then
            VER="${TAG#mobile-v}"
            echo "Using tag version: $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            if [ -f package.json ]; then
              VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
            else
              VER="1.0.0"
            fi
            echo "Using fallback version: $VER"
            echo "version_name=$VER" >> "$GITHUB_OUTPUT"
            CODE=${GITHUB_RUN_NUMBER}
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: prepare-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update app.json with version
        run: |
          node -e "
          const fs = require('fs');
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.version = '${{ needs.prepare-build.outputs.version_name }}';
          appJson.expo.android = appJson.expo.android || {};
          appJson.expo.android.versionCode = parseInt('${{ needs.prepare-build.outputs.version_code }}');
          appJson.expo.ios = appJson.expo.ios || {};
          appJson.expo.ios.buildNumber = '${{ needs.prepare-build.outputs.version_code }}';
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
          console.log('Updated app.json:', JSON.stringify(appJson.expo, null, 2));
          "

      - name: Expo Prebuild (Generate Native Directories)
        run: |
          npx expo prebuild --clean --platform android
          echo "=== Generated Android Structure ==="
          ls -la android/
          ls -la android/app/ || true

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region us-east-1
          aws configure set output json

      - name: Setup Keystore Directory
        run: mkdir -p android/app/keystore

      - name: Download or Create Keystore
        run: |
          KEYSTORE_PATH="android/app/keystore/elbiblio.jks"
          R2_KEYSTORE_PATH="s3://${{ secrets.R2_KEYSTORE_BUCKET }}/keystore/elbiblio.jks"
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          echo "Checking if keystore exists in R2..."
          if aws s3 ls "$R2_KEYSTORE_PATH" --endpoint-url="$R2_ENDPOINT" > /dev/null 2>&1; then
            echo "Keystore found in R2, downloading..."
            aws s3 cp "$R2_KEYSTORE_PATH" "$KEYSTORE_PATH" --endpoint-url="$R2_ENDPOINT"
            
            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
              echo "✓ Keystore verification successful"
            else
              echo "✗ Keystore verification failed"
              exit 1
            fi
          else
            echo "Creating new keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias elbiblio \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              -dname "CN=Elbiblio, OU=Mobile, O=Elbiblio, L=Unknown, S=Unknown, C=US"

            aws s3 cp "$KEYSTORE_PATH" "$R2_KEYSTORE_PATH" --endpoint-url="$R2_ENDPOINT"
            echo "✓ Keystore uploaded to R2"
          fi
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create gradle.properties for signing
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=keystore/elbiblio.jks
          MYAPP_UPLOAD_KEY_ALIAS=elbiblio
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Configure signing in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # Check if signing config already exists
          if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            echo "Adding signing configuration to build.gradle..."
            
            # Add signing config after android { block
            sed -i '/^android {/a\
            \    signingConfigs {\
            \        release {\
            \            if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {\
            \                storeFile file(MYAPP_UPLOAD_STORE_FILE)\
            \                storePassword MYAPP_UPLOAD_STORE_PASSWORD\
            \                keyAlias MYAPP_UPLOAD_KEY_ALIAS\
            \                keyPassword MYAPP_UPLOAD_KEY_PASSWORD\
            \            }\
            \        }\
            \    }' "$BUILD_GRADLE"
            
            # Add signing config to release buildType
            sed -i '/buildTypes {/,/release {/a\
            \            signingConfig signingConfigs.release' "$BUILD_GRADLE"
          fi
          
          echo "=== Signing Configuration ==="
          grep -A 10 "signingConfigs" "$BUILD_GRADLE" || echo "No signing config found"

      - name: Build Android APK and AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --parallel --daemon --info
          
          echo "=== Build Outputs ==="
          find app/build/outputs -name "*.apk" -o -name "*.aab"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Find and Verify Build Outputs
        id: find-files
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | grep -v "unsigned" | head -1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: No signed APK found"
            find android/app/build/outputs -name "*.apk"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$AAB_PATH" ]; then
            echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          fi
          
          echo "=== Build Artifacts ==="
          ls -lh "$APK_PATH"
          if [ -n "$AAB_PATH" ]; then
            ls -lh "$AAB_PATH"
          fi
          
          # Verify APK is signed
          if command -v apksigner &> /dev/null; then
            echo "=== APK Signature Verification ==="
            apksigner verify --verbose "$APK_PATH" || echo "APK verification failed"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elbiblio-android-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.find-files.outputs.apk_path }}
          retention-days: 30

      - name: Upload AAB
        if: steps.find-files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: elbiblio-android-bundle-${{ needs.prepare-build.outputs.build_id }}
          path: ${{ steps.find-files.outputs.aab_path }}
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -rf android/app/keystore
          rm -f android/gradle.properties

  build-ios:
    needs: prepare-build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-build.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update app.json with version
        run: |
          node -e "
          const fs = require('fs');
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.version = '${{ needs.prepare-build.outputs.version_name }}';
          appJson.expo.ios = appJson.expo.ios || {};
          appJson.expo.ios.buildNumber = '${{ needs.prepare-build.outputs.version_code }}';
          appJson.expo.android = appJson.expo.android || {};
          appJson.expo.android.versionCode = parseInt('${{ needs.prepare-build.outputs.version_code }}');
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
          console.log('Updated app.json:', JSON.stringify(appJson.expo, null, 2));
          "

      - name: Expo Prebuild (Generate Native Directories)
        run: |
          npx expo prebuild --clean --platform ios
          echo "=== Generated iOS Structure ==="
          ls -la ios/

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          echo "=== CocoaPods Installation Complete ==="
          ls -la

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region us-east-1
          aws configure set output json

      - name: Download iOS signing assets from R2
        run: |
          mkdir -p ios/signing
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.R2_KEYSTORE_BUCKET }}"
          
          echo "Downloading iOS signing materials from R2..."
          aws s3 cp "s3://$BUCKET/iosbuild/distribution.cer" ios/signing/distribution.cer --endpoint-url="$R2_ENDPOINT"
          aws s3 cp "s3://$BUCKET/iosbuild/Venmail_Distribution.p12" ios/signing/ios_dist.p12 --endpoint-url="$R2_ENDPOINT"
          aws s3 cp "s3://$BUCKET/iosbuild/Elbiblio.mobileprovision" ios/signing/Elbiblio.mobileprovision --endpoint-url="$R2_ENDPOINT"
          aws s3 cp "s3://$BUCKET/iosbuild/AuthKey_4WKTZ9VTBH_ConnectKey.p8" ios/signing/AuthKey.p8 --endpoint-url="$R2_ENDPOINT" || true
          
          ls -la ios/signing/

      - name: Create temporary keychain
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          P12_PASSWORD="${{ secrets.IOS_KEYCHAIN_PASSWORD }}"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          
          # Import certificate and p12
          security import ios/signing/distribution.cer -k "$KEYCHAIN" -A
          security import ios/signing/ios_dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -A || \
          security import ios/signing/ios_dist.p12 -k "$KEYCHAIN" -P "" -A
          
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          
          # Add to keychain search list
          CURRENT_LIST=$(security list-keychains -d user | sed 's/[""]//g')
          security list-keychains -d user -s "$KEYCHAIN" $CURRENT_LIST
          
          echo "=== Available Signing Identities ==="
          security find-identity -p codesigning -v
          
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        id: install-profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          security cms -D -i ios/signing/Elbiblio.mobileprovision > ios/signing/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" ios/signing/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" ios/signing/profile.plist)
          
          if [ -z "$PROFILE_UUID" ]; then
            echo "Error: Failed to extract UUID from provisioning profile"
            exit 1
          fi
          
          cp ios/signing/Elbiblio.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "✓ Provisioning profile installed: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Parse provisioning profile details
        id: parse-profile
        run: |
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" ios/signing/profile.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" ios/signing/profile.plist)
          BUNDLE_ID=${APP_ID#${TEAM_ID}.}
          
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Detect signing identity
        id: detect-identity
        run: |
          IDENTITY=$(security find-identity -p codesigning -v | grep 'Apple Distribution' | head -n1 | grep -o '[A-F0-9]\{40\}')
          
          if [ -z "$IDENTITY" ]; then
            echo "Error: No Apple Distribution identity found"
            security find-identity -p codesigning -v
            exit 1
          fi
          
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "✓ Found signing identity: $IDENTITY"

      - name: Find Xcode workspace/project
        id: find-xcode
        run: |
          cd ios
          
          # Look for workspace first (preferred for CocoaPods)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          
          if [ -n "$WORKSPACE" ]; then
            XCODE_FILE=$(basename "$WORKSPACE")
            USE_WORKSPACE="true"
          elif [ -n "$PROJECT" ]; then
            XCODE_FILE=$(basename "$PROJECT")
            USE_WORKSPACE="false"
          else
            echo "Error: No Xcode workspace or project found"
            ls -la
            exit 1
          fi
          
          # Detect scheme name
          SCHEME=$(basename "$XCODE_FILE" .xcworkspace)
          SCHEME=$(basename "$SCHEME" .xcodeproj)
          
          echo "xcode_file=$XCODE_FILE" >> "$GITHUB_OUTPUT"
          echo "use_workspace=$USE_WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          
          echo "✓ Xcode file: $XCODE_FILE"
          echo "✓ Scheme: $SCHEME"
          echo "✓ Using workspace: $USE_WORKSPACE"

      - name: Build iOS Archive
        run: |
          cd ios
          
          XCODE_FILE="${{ steps.find-xcode.outputs.xcode_file }}"
          SCHEME="${{ steps.find-xcode.outputs.scheme }}"
          USE_WORKSPACE="${{ steps.find-xcode.outputs.use_workspace }}"
          
          if [ "$USE_WORKSPACE" = "true" ]; then
            BUILD_CMD="xcodebuild archive -workspace $XCODE_FILE"
          else
            BUILD_CMD="xcodebuild archive -project $XCODE_FILE"
          fi
          
          $BUILD_CMD \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ steps.parse-profile.outputs.team_id }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.detect-identity.outputs.identity }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.install-profile.outputs.uuid }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            | tee build.log
          
          if [ ! -d "build/App.xcarchive" ]; then
            echo "Error: Archive not created"
            tail -100 build.log
            exit 1
          fi
          
          echo "✓ Archive created successfully"

      - name: Export IPA
        run: |
          cd ios
          
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ steps.parse-profile.outputs.team_id }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ steps.parse-profile.outputs.bundle_id }}</key>
                  <string>${{ steps.install-profile.outputs.name }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist \
            | tee export.log
          
          if [ ! -f "build/export/"*.ipa ]; then
            echo "Error: IPA not created"
            tail -100 export.log
            exit 1
          fi
          
          # Rename IPA
          mv build/export/*.ipa build/export/Elbiblio.ipa
          
          echo "✓ IPA exported successfully"
          ls -lh build/export/Elbiblio.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: elbiblio-ios-${{ needs.prepare-build.outputs.build_id }}
          path: ios/build/export/Elbiblio.ipa
          retention-days: 30

      - name: Upload to TestFlight (Optional)
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ios/build/export/Elbiblio.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            || echo "TestFlight upload failed or not configured"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -rf ios/signing
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision

  release:
    needs:
      - prepare-build
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    if: needs.prepare-build.outputs.tag != ''
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-build.outputs.tag }}
          name: Mobile Release ${{ needs.prepare-build.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}