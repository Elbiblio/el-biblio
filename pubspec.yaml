name: elbiblio
description: El-Biblio - a personal spiritual operating system built with Flutter.
publish_to: none
version: 1.0.32+10033

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^12.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.3.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0
  json_annotation: ^4.8.0
  intl: ^0.18.0
  logger: ^2.0.2+1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  speech_to_text: ^7.0.0
  permission_handler: ^11.0.0
  flutter_contacts: ^1.1.9
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
