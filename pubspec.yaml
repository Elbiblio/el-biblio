name: elbiblio
description: El-Biblio - a personal spiritual operating system built with Flutter.
publish_to: none
version: 1.1.12+10112

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

platforms:
  android:
  ios:
  windows:

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^12.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.3.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  logger: ^2.0.2+1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.0.0
  flutter_contacts: ^1.1.9
  crypto: ^3.0.3
  wakelock_plus: ^1.4.0
  do_not_disturb: ^1.0.3
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  timeago: ^3.7.1
  freezed_annotation: 2.4.4
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_quill: ^11.5.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.4.0
  package_info_plus: ^9.0.0
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  share_plus: ^10.1.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  confetti: ^0.7.0
  fl_chart: ^0.69.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  app_usage: ^4.1.0
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # flutter_native_splash has a native Android FlutterNativeSplashPlugin class
  # that Flutter's Gradle plugin includes in GeneratedPluginRegistrant.java.
  # Dev dependencies don't get their AARs on the compile classpath, causing
  # "package net.jonhanson.flutter_native_splash does not exist" at build time.
  # Must live in dependencies so the AAR is available to the compiler.
  flutter_native_splash: ^2.4.1
  livekit_client: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0
  freezed: ^2.4.1
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/countdown/
    - assets/audio/prompts/
    - assets/fonts/
    - assets/bibles/
    - assets/game/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

# Flutter Native Splash configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo_android12.png"
    color: "#FFFFFF"
  web: false
